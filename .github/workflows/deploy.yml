name: Daily Build & Deploy

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间早上 8 点）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'assets/**'
      - 'scripts/**'
      - 'index.html'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于生成日期

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install --quiet --upgrade pip
          # 如果有 requirements.txt 则安装
          if [ -f scripts/requirements.txt ]; then
            pip install --quiet -r scripts/requirements.txt
          fi

      - name: Run build script
        run: |
          python scripts/build.py

      - name: Verify build output
        run: |
          ls -la dist/
          echo "Total files: $(find dist -type f | wc -l)"
          # 确保关键文件存在
          test -f dist/index.html
          test -f dist/rss.xml
          test -f dist/archive.html
          test -f dist/tags.html
          test -f dist/about.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4